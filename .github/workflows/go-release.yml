name: Go Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of a published Go GitHub Release to run again, for example go/v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'go/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          if ! printf '%s' "$tag" | grep -Eq '^go/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid Go release tag: $tag" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "release tag does not exist locally: $tag" >&2
            exit 1
          fi
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" != "false" ]; then
            echo "no published GitHub Release for $tag; publish the release to start this workflow" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#go/}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        run: git checkout --detach "${{ steps.release.outputs.tag }}"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.0
          working-directory: go
          args: ./...

      - name: Validate Go implementation
        working-directory: go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          ./scripts/check-go-coverage.sh
          go build ./cmd/slophammer-go
          ./scripts/check-go-install.sh
          go run ./cmd/slophammer-go check ..
          go run ./cmd/slophammer-go check .. --execute

      - uses: astral-sh/setup-uv@v7
      - name: Sync the Python implementation
        working-directory: .
        run: uv sync --frozen --directory python
      - name: Mutation gate on changes since the last stamp
        working-directory: go
        run: go run ./cmd/slophammer-go mutate ..

      - name: Validate shared conformance
        run: |
          npm ci --prefix typescript
          node scripts/check-conformance.mjs

      - name: Verify tagged go install
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tmp="$(mktemp -d)"
          GOBIN="$tmp/bin" go install "github.com/osolmaz/slophammer/go/cmd/slophammer-go@$RELEASE_VERSION"
          "$tmp/bin/slophammer-go" help
          "$tmp/bin/slophammer-go" rules --format json
